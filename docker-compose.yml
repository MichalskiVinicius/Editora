version: '3.8'

services:
  # 1. API Gateway (Kong)
  kong:
    image: kong:3.4-ubuntu
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - acl-service
    networks:
      - editora-network

  # 2. Event-Driven Backbone (Kafka)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - editora-network

  # 3. Base de Dados Transacional (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agiledb
    ports:
      - "5432:5432"
    networks:
      - editora-network

  # 4. Anti-Corruption Layer (Mainframe)
  acl-service:
    build: .
    command: node server.js
    ports:
      - "3000:3000"
    depends_on:
      - kafka
    networks:
      - editora-network
    restart: always

  # 5. Microsserviço de Royalties
  royalties-service:
    build: .
    command: node royalties.js
    depends_on:
      - kafka
      - acl-service
    networks:
      - editora-network
    restart: always

  # 6. Microsserviço de Catálogo
  catalogo-service:
    build: .
    command: node catalogo.js
    depends_on:
      - kafka
      - acl-service
    networks:
      - editora-network
    restart: always

  ai-agent-service:
    build: .
    command: ["node", "agente-ia.js"]
    depends_on:
      - kafka
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - editora-network
    restart: always

networks:
  editora-network:
    driver: bridge